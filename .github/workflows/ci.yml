name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      # Hosted runners use software rendering. Real-time input and frame-rate
      # checks run on a graphics-capable machine with npm run verify before release.
      - name: Verify architecture, rules, relay, menus and simulated waves
        run: npm run verify -- menu-check waves-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: artifacts
          if-no-files-found: ignore
